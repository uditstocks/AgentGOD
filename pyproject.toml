[project]
name = "dynamic-agent-creator"
version = "0.1.0"
description = "One permanent AI agent that builds, runs and retires other agents per task."
requires-python = ">=3.10"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"

[tool.pyright]
# The machine-written agents in inventory/ and generated_agents/ follow the
# trusted runtime's own conventions; type-checking the main codebase must not
# depend on what the machine last wrote there.
exclude = ["**/__pycache__", ".venv", ".agent_venv", "inventory", "generated_agents", "runs"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "C4", "RUF"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["SLF001"]
